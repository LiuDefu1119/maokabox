    function catSvg(cat,size=110){const fill=cat.color||'#f5ad64',accent=cat.accent||'#785247',eyes=cat.eyes||'#594046';return `<svg class="cat-svg" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${cat.name}"><path d="M18 39 21 10 42 27Q50 24 58 27L79 10 82 39Q90 49 87 67 83 91 50 92 17 91 13 67 10 49 18 39Z" fill="${fill}" stroke="${accent}" stroke-width="4" stroke-linejoin="round"/><path d="M22 23 27 31 36 26M78 23 73 31 64 26" fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round"/><ellipse cx="34" cy="52" rx="6" ry="8" fill="${eyes}"/><ellipse cx="66" cy="52" rx="6" ry="8" fill="${eyes}"/><circle cx="32" cy="49" r="2" fill="#fff"/><circle cx="64" cy="49" r="2" fill="#fff"/><path d="M47 63Q50 66 53 63M50 66V71M44 72Q50 77 56 72" fill="none" stroke="${accent}" stroke-width="2.5" stroke-linecap="round"/></svg>`}
    function catImage(cat,size=110){const src=catImages[cat.id]||catImages[cat.name];const visual=src?`<img class="cat-image" src="${src}" width="${size}" height="${size}" alt="${cat.name}" draggable="false" decoding="async">`:catSvg(cat,size);return `<span class="cat-visual" style="width:${size}px;height:${size}px" data-cat-id="${cat.id}">${visual}<i class="cat-blink" aria-hidden="true"></i></span>`}
    function weighted(weights,allowedMin){let entries=Object.entries(weights).filter(([r,w])=>w&&rarityOrder.indexOf(r)>=allowedMin);const total=entries.reduce((a,[,w])=>a+w,0);let n=Math.random()*total;for(const [r,w] of entries){n-=w;if(n<=0)return r}return entries[entries.length-1][0]}
    function rollOne(box,isFirst=false,forceLegendary=false){if(isFirst){const r=weighted({blue:55,purple:25,gold:20},1);return resultForRarity(r)}if(!forceLegendary&&Math.random()<(box.hiddenRate??.001))return resultForRarity('hidden');const available=Object.keys(box.weights).filter(r=>box.weights[r]>0);const maxIndex=Math.max(...available.map(r=>rarityOrder.indexOf(r)));const pityRarity=box.weights.gold>0?'gold':rarityOrder[maxIndex];let r=forceLegendary?pityRarity:weighted(box.weights,0);return resultForRarity(r)}
    function resultForRarity(r){const list=cats.filter(c=>c.rarity===r);return {...list[Math.floor(Math.random()*list.length)],rarity:r}}
    function drawResults(box,count,isFirst){let arr=[];for(let i=0;i<count;i++){const free=isFirst&&i===0;const force=!free&&state.pity+1>=200;const result=rollOne(box,free,force);arr.push(result);if(!free){state.totalPulls++;if(force||['gold','rainbow','hidden'].includes(result.rarity))state.pity=0;else state.pity++}}if(count===10&&!arr.some(x=>['purple','gold','rainbow','hidden'].includes(x.rarity))){arr[9]=resultForRarity('purple')}if(count===10)arr.sort((a,b)=>rarityOrder.indexOf(a.rarity)-rarityOrder.indexOf(b.rarity));return arr}
    function addResult(result,options={}){if(state.cats.includes(result.id)){if(result.id==='rainbowcat'&&options.allowHiddenCopy){state.hiddenCopies=Math.max(1,state.hiddenCopies||1)+1;toast(`隐藏彩虹猫 +1，当前 ${state.hiddenCopies} 只`)}else{state.shards+=rarity[result.rarity].shards;toast(`重复猫转化为 ${rarity[result.rarity].shards} 碎片`)}}else{state.cats.push(result.id);if(result.id==='rainbowcat')state.hiddenCopies=Math.max(1,state.hiddenCopies||0);if(!state.firstPlacementReward){state.firstPlacementReward=true;state.coins+=180;toast('首只猫入驻，开业补贴 +180 金币')}}collectionBonus();if(options.deferUI)return;save();updateUI();queueScoreSubmit()}
    function unlockAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch{audioCtx=null}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}

    function playMusicNote(freq,duration=.5,gain=.006,delay=0,type='triangle'){if(state.muted||!audioCtx)return;const t=audioCtx.currentTime+delay+Math.random()*.012,velocity=gain*(.94+Math.random()*.1),o=audioCtx.createOscillator(),h=audioCtx.createOscillator(),g=audioCtx.createGain(),hg=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,t);o.detune.setValueAtTime((Math.random()-.5)*4,t);h.type='sine';h.frequency.setValueAtTime(freq*2,t);filter.type='lowpass';filter.frequency.setValueAtTime(type==='sine'?1350:980,t);filter.Q.value=.4;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(velocity,t+.055);g.gain.exponentialRampToValueAtTime(.0001,t+duration);hg.gain.setValueAtTime(.0001,t);hg.gain.exponentialRampToValueAtTime(velocity*.06,t+.045);hg.gain.exponentialRampToValueAtTime(.0001,t+Math.min(duration,.34));o.connect(g).connect(filter);h.connect(hg).connect(filter);filter.connect(ensureMusicBus());o.start(t);h.start(t);o.stop(t+duration+.03);h.stop(t+Math.min(duration,.34)+.03)}
    function musicStep(){if(!audioCtx||state.muted){stopMusic();return}const step=musicIndex++%musicMelody.length,beat=step%4,chord=musicChords[Math.floor(step/4)%musicChords.length],melody=musicMelody[step],arp=chord[musicArpeggio[beat]];playMusicNote(arp,1.12,.0025,0,'triangle');if(beat===0)playMusicNote(chord[0]/2,2.1,.0038,0,'sine');if(melody)playMusicNote(melody,.52,.0055,.035,'sine')}

    function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
    function tone(freq,duration=.12,type='sine',gain=.04,delay=0){if(state.muted||!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}
    function playRaritySound(r){unlockAudio();const seq={white:[392],blue:[392,523],purple:[392,523,659],gold:[262,392,523,784],rainbow:[330,494,659,988],hidden:[220,440,660,880,1320]}[r]||[392];seq.forEach((f,i)=>tone(f,r==='hidden'?.2:.13,r==='gold'||r==='hidden'?'triangle':'sine',r==='hidden'?.065:.04,i*.065));if(r==='gold'||r==='rainbow'||r==='hidden')setTimeout(()=>tone(98,.25,'sine',.055),90)}

    function collectionMarkup(){const synthCost=hiddenSynthesisCost();return `<div class="cat-grid">${cats.map(c=>{const owned=state.cats.includes(c.id);const featured=state.featuredCats.includes(c.id);const ownedCount=c.id==='rainbowcat'?(state.hiddenCopies||0):owned?1:0;return `<div class="cat-card ${owned?'owned':''}" data-cat-detail="${c.id}" tabindex="0" role="button" aria-label="查看${c.name}详情"><div class="cat-art ${owned?'':'cat-art-locked'}">${catImage(c,95)}${owned?'':'<span class="lock-mark"><i class="lock-icon" aria-hidden="true"></i>未解锁</span>'}</div><strong>${c.name}</strong><small>${owned?'+'+rarity[c.rarity].income+'/秒'+(c.id==='rainbowcat'?` · ${ownedCount}只`:''):'抽到后解锁'}</small><div class="rarity-tag ${rarity[c.rarity].tag}">${rarity[c.rarity].label}</div>${owned?'<span class="owned-mark">✓</span>':''}${owned?`<button type="button" class="feature-btn ${featured?'selected':''}" data-feature-cat="${c.id}" aria-label="${featured?'取消主角':'设为主角'}">${featured?'★ 主角':'☆ 设为主角'}</button>`:''}</div>`}).join('')}</div><div style="margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff"><strong style="font-size:13px">彩虹合成台</strong><p style="font-size:11px;color:var(--muted);margin:5px 0 10px">每次合成都会得到一只隐藏彩虹猫，成本按 2000 → 4000 → 8000 碎片递增。</p><button class="primary-btn" data-synth ${state.shards<synthCost?'disabled':''}>${state.shards<synthCost?`还差 ${synthCost-state.shards} 碎片`:`${fmt(synthCost)} 碎片合成隐藏款`}<small>当前碎片 ${fmt(state.shards)} · 已合成 ${state.hiddenSynthCount||0} 次</small></button></div>`}
    function probabilityMarkup(){const pct=n=>`${(n*100).toFixed(n<.01?2:1)}%`;const rows=boxes.map(box=>{const total=Object.values(box.weights).reduce((a,b)=>a+b,0);const items=rarityOrder.filter(r=>box.weights[r]>0).map(r=>`<span>${rarity[r].label} ${pct(box.weights[r]/total)}</span>`).join('');return `<div class="probability-box"><strong>${box.name}</strong><div>${items}</div><small>隐藏款 ${pct(box.hiddenRate)} · 权重总和 ${total}</small></div>`}).join('');return `<p class="section-note">概率 = 档位权重 ÷ 本盲盒权重总和；隐藏款先独立判定，再按下列权重抽取。</p>${rows}<div class="probability-rules"><strong>固定规则</strong><p>首抽保证蓝色及以上；十连至少 1 只紫色及以上；第 200 抽保证高稀有（当前：${state.pity}/200）。</p><p>重复猫转化为对应稀有度碎片：普通 ${rarity.white.shards}、稀有 ${rarity.blue.shards}、史诗 ${rarity.purple.shards}、传说 ${rarity.gold.shards}、神话 ${rarity.rainbow.shards}、隐藏 ${rarity.hidden.shards}。</p><p>彩虹猫合成成本：${fmt(hiddenSynthesisCost())} 碎片起，之后每次翻倍。</p></div>`}

    function leaderboardMarkup(data){if(!data.online)return `<div class="leaderboard-local">本地成绩 · 娱乐排行（数据保存在本机，可被修改，不代表官方榜单）</div><div class="leaderboard-data"><span>我的图鉴 ${state.cats.length}/27</span><span>金币 ${fmt(state.coins)}</span></div>`;if(data.error&&!data.list.length)return `<div class="leaderboard-empty">Toy 榜单暂时不可用，单机玩法不受影响。</div>`;const rows=data.list.map(item=>{const mine=data.mine.ranked&&item.rank===data.mine.rank;const avatar=item.avatar&&/^https?:|^\/\//.test(item.avatar)?`<img class="rank-avatar" src="${htmlEscape(item.avatar)}" alt="">`:`<span class="rank-avatar" aria-hidden="true">${htmlEscape(String(item.nickname||'?').slice(0,1))}</span>`;return `<div class="rank-row ${mine?'mine':''}"><span class="rank-number">${Number(item.rank)||'-'}</span><span class="rank-player">${avatar}<span class="rank-nickname">${htmlEscape(item.nickname||'B站玩家')}</span></span><strong class="rank-score">${fmt(item.score||0)} 只</strong></div>`}).join('');const mine=data.mine&&data.mine.ranked?`<div class="leaderboard-me"><span>我的排名</span><strong>第 ${data.mine.rank} 名 · ${fmt(data.mine.score)} 只</strong></div>`:'<div class="leaderboard-me"><span>我的排名</span><strong>暂未上榜</strong></div>';return `<div class="leaderboard-list">${rows||'<div class="leaderboard-empty">还没有榜单记录，成为第一个收集猫咪的人吧。</div>'}</div>${mine}<div class="leaderboard-data"><span>我的图鉴 ${state.cats.length}/27</span><span>金币 ${fmt(state.coins)}</span></div>`}
    async function loadLeaderboard(){if(leaderboardBusy)return;leaderboardBusy=true;$('leaderboardBody').innerHTML='<div class="leaderboard-local">正在读取排行榜…</div>';try{await window.ToyBridge.submitCollection(state.cats.length);const data=await window.ToyBridge.getLeaderboard(50);leaderboardCache=data;$('leaderboardStatus').textContent=data.online?'Toy 榜单':'本地模式';$('leaderboardStatus').classList.toggle('online',data.online);$('leaderboardBody').innerHTML=leaderboardMarkup(data);if(data.online&&data.mine?.ranked&&data.mine.rank<=10)toast(`你已进入图鉴榜前 ${data.mine.rank}！`)}catch{$('leaderboardStatus').textContent='本地模式';$('leaderboardStatus').classList.remove('online');$('leaderboardBody').innerHTML='<div class="leaderboard-empty">排行榜暂时不可用，单机玩法不受影响。</div>'}finally{leaderboardBusy=false}}
    function openLeaderboard(){if($('catDetailBackdrop').classList.contains('open'))closeCatDetail();$('leaderboardBackdrop').classList.add('open');$('leaderboardBackdrop').setAttribute('aria-hidden','false');loadLeaderboard();}
    function closeLeaderboard(){$('leaderboardBackdrop').classList.remove('open');$('leaderboardBackdrop').setAttribute('aria-hidden','true')}
    window.ToyBridge={version:'toy-sdk-v1',isAvailable:hasToySdk,getDisplayName:()=>state.playerName,getLeaderboardSnapshot:()=>({name:state.playerName,collection:state.cats.length,income:incomePerSecond(),coins:Math.floor(state.coins)}),refreshProfile:refreshToyProfile,submitCollection:submitCollectionScore,getLeaderboard:fetchLeaderboard};
    load();initPowerMode();bind();updateUI();startCoinParticles();setTimeout(()=>window.ToyBridge.refreshProfile(),250);setInterval(tick,200);
  })();
  </script>
</body>
