    async function revealResult(result,index,total){addResult(result,{deferUI:true});const mini=document.createElement('button');mini.type='button';mini.className=`mini-result rarity-${result.rarity}`;mini.dataset.resultIndex=index;mini.setAttribute('aria-label',`查看第 ${index+1} 张：${result.name}`);mini.innerHTML=catImage(result,30);mini.addEventListener('click',()=>selectResult(index));$('resultStrip').appendChild(mini);showRevealDetails(result,index,total);effect(result.rarity);if(index===0)$('revealCard').classList.add('bounce')}
    function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2450)}
    function openDrawer(type){$('drawerTitle').textContent=type==='collection'?'图鉴':'升级猫咖';$('drawerBody').innerHTML=type==='collection'?collectionMarkup():upgradeMarkup();$('drawerBackdrop').classList.add('open')}
    function hiddenSynthesisCost(){return Math.min(Number.MAX_SAFE_INTEGER,2000*Math.pow(2,state.hiddenSynthCount||0))}
    function collectionMarkup(){const synthCost=hiddenSynthesisCost();return `<div class="cat-grid">${cats.map(c=>{const owned=state.cats.includes(c.id);const featured=state.featuredCats.includes(c.id);const ownedCount=c.id==='rainbowcat'?(state.hiddenCopies||0):owned?1:0;return `<div class="cat-card ${owned?'owned':''}" data-cat-detail="${c.id}" tabindex="0" role="button" aria-label="查看${c.name}详情"><div class="cat-art ${owned?'':'cat-art-locked'}">${catImage(c,95)}${owned?'':'<span class="lock-mark"><i class="lock-icon" aria-hidden="true"></i>未解锁</span>'}</div><strong>${c.name}</strong><small>${owned?'+'+rarity[c.rarity].income+'/秒'+(c.id==='rainbowcat'?` · ${ownedCount}只`:''):'抽到后解锁'}</small><div class="rarity-tag ${rarity[c.rarity].tag}">${rarity[c.rarity].label}</div>${owned?'<span class="owned-mark">✓</span>':''}${owned?`<button type="button" class="feature-btn ${featured?'selected':''}" data-feature-cat="${c.id}" aria-label="${featured?'取消主角':'设为主角'}">${featured?'★ 主角':'☆ 设为主角'}</button>`:''}</div>`}).join('')}</div><div style="margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff"><strong style="font-size:13px">彩虹合成台</strong><p style="font-size:11px;color:var(--muted);margin:5px 0 10px">每次合成都会得到一只隐藏彩虹猫，成本按 2000 → 4000 → 8000 碎片递增。</p><button class="primary-btn" data-synth ${state.shards<synthCost?'disabled':''}>${state.shards<synthCost?`还差 ${synthCost-state.shards} 碎片`:`${fmt(synthCost)} 碎片合成隐藏款`}<small>当前碎片 ${fmt(state.shards)} · 已合成 ${state.hiddenSynthCount||0} 次</small></button></div>`}
    function probabilityMarkup(){const pct=n=>`${(n*100).toFixed(n<.01?2:1)}%`;const rows=boxes.map(box=>{const total=Object.values(box.weights).reduce((a,b)=>a+b,0);const items=rarityOrder.filter(r=>box.weights[r]>0).map(r=>`<span>${rarity[r].label} ${pct(box.weights[r]/total)}</span>`).join('');return `<div class="probability-box"><strong>${box.name}</strong><div>${items}</div><small>隐藏款 ${pct(box.hiddenRate)} · 权重总和 ${total}</small></div>`}).join('');return `<p class="section-note">概率 = 档位权重 ÷ 本盲盒权重总和；隐藏款先独立判定，再按下列权重抽取。</p>${rows}<div class="probability-rules"><strong>固定规则</strong><p>首抽保证蓝色及以上；十连至少 1 只紫色及以上；第 200 抽保证高稀有（当前：${state.pity}/200）。</p><p>重复猫转化为对应稀有度碎片：普通 ${rarity.white.shards}、稀有 ${rarity.blue.shards}、史诗 ${rarity.purple.shards}、传说 ${rarity.gold.shards}、神话 ${rarity.rainbow.shards}、隐藏 ${rarity.hidden.shards}。</p><p>彩虹猫合成成本：${fmt(hiddenSynthesisCost())} 碎片起，之后每次翻倍。</p></div>`}
    function openProbability(){ $('probabilityBody').innerHTML=probabilityMarkup();$('probabilityBackdrop').classList.add('open');$('probabilityBackdrop').setAttribute('aria-hidden','false');$('closeProbability').focus() }
    function closeProbability(){ $('probabilityBackdrop').classList.remove('open');$('probabilityBackdrop').setAttribute('aria-hidden','true') }
    function openCatDetail(id){const cat=catById[id];if(!cat)return;const profile=catProfiles[id]||{story:'还没有关于它的记录。',tags:[]};const owned=state.cats.includes(id);const detail=$('catDetailPanel');detail.className=`cat-detail-panel rarity-${cat.rarity} ${owned?'':'cat-detail-locked'}`;detail.style.setProperty('--cat-soft',cat.color||'#fff0e5');detail.style.setProperty('--cat-accent',cat.accent||'#e9b39b');const badge=`<span class="rarity-tag ${rarity[cat.rarity].tag}">${rarity[cat.rarity].label}</span>`;const status=owned?'<span class="cat-detail-status is-owned">✓ 已收集</span>':'<span class="cat-detail-status">未收集</span>';const extra=owned?`<div class="cat-detail-story"><strong>品种故事</strong>${profile.story}</div><div class="cat-detail-tags">${profile.tags.map(tag=>`<span class="cat-detail-tag">${tag}</span>`).join('')}</div><div class="cat-detail-stats"><div class="cat-detail-stat"><small>自动产出</small><strong>+${rarity[cat.rarity].income} 金币/秒</strong></div><div class="cat-detail-stat"><small>重复转化</small><strong>${rarity[cat.rarity].shards} 碎片</strong></div></div>`:'<p class="cat-detail-hint">还没抽到它…</p>';$('catDetailBody').innerHTML=`<div class="cat-detail-body"><div class="cat-detail-head"><div class="cat-detail-kicker">${cat.series} · 图鉴详情</div><h2 id="catDetailName">${cat.name}</h2><div class="cat-detail-badges">${badge}${status}</div></div><div class="cat-detail-art">${catImage(cat,220)}</div>${extra}</div>`;$('catDetailBackdrop').classList.add('open');$('catDetailBackdrop').setAttribute('aria-hidden','false');$('closeCatDetail').focus()}
    function closeCatDetail(){$('catDetailBackdrop').classList.remove('open');$('catDetailBackdrop').setAttribute('aria-hidden','true')}
    function toggleFeatured(id){if(!state.cats.includes(id))return;const index=state.featuredCats.indexOf(id);if(index>=0){state.featuredCats.splice(index,1);toast('已取消主角展示')}else if(state.featuredCats.length>=2){toast('最多设置 2 只主角猫')}else{state.featuredCats.push(id);toast(`${catById[id].name} 已设为主角`)}save();updateUI();openDrawer('collection')}
    function upgradeMarkup(){return `<div class="upgrade-list">${upgradeConfig.slice(1).map(cfg=>{const done=state.cafeLevel>=cfg.level,can=state.cafeLevel===cfg.level-1&&state.coins>=cfg.cost;return `<div class="upgrade-row"><div class="meta"><strong>猫咖 Lv.${cfg.level} ${done?'✓':''}</strong><p>${cfg.unlock} · ${cfg.mult.toFixed(2)}x基础产出 · ${cfg.slots}展示位</p></div><button class="${done?'locked':''}" data-upgrade="${cfg.level}" ${done||state.cafeLevel!==cfg.level-1?'disabled':''}>${done?'已升级':fmt(cfg.cost)+' 金币'}</button></div>`}).join('')}</div><p class="section-note">升级不会清空猫猫，新的盲盒会在猫咖变热闹后开放。</p>`}
    function upgradeTo(level){const cfg=upgradeConfig[level-1];if(state.cafeLevel!==level-1||state.coins<cfg.cost)return;state.coins-=cfg.cost;state.cafeLevel=level;toast(`猫咖升级到 Lv.${level}，${cfg.unlock}`);save();updateUI();openDrawer('upgrade')}
    function tick(){const now=Date.now(),delta=Math.min(3,(now-lastTick)/1000);lastTick=now;const income=incomePerSecond();if(income>0){state.coins+=income*delta;state.incomeTicks+=delta;const whole=Math.floor(state.incomeTicks);if(whole>=10&&!state.tickRewarded){state.tickRewarded=true;state.coins+=100;toast('营业 10 秒奖励 +100 金币')}if(Math.random()<delta*.55)showIncomeFloat(income*delta)}saveTimer+=delta;if(saveTimer>2){saveTimer=0;save()}updateUI()}
    function showIncomeFloat(amount){if(motionReduced())return;const workers=[...document.querySelectorAll('#sceneWorkers .worker-cat')];if(!workers.length)return;const burst=1;for(let i=0;i<burst;i++){const worker=workers[(incomeCursor+i)%workers.length],float=document.createElement('span'),rate=worker.dataset.rate||amount.toFixed(1);float.className='cat-income-float';float.innerHTML=`<span class="coin-particle" aria-hidden="true"></span><span class="cat-income-text">+${rate}/s</span>`;worker.appendChild(float);worker.classList.remove('earning');void worker.offsetWidth;worker.classList.add('earning');setTimeout(()=>{float.remove();worker.classList.remove('earning')},920)}incomeCursor=(incomeCursor+burst)%workers.length}
    function playPetSound(){unlockAudio();tone(620,.085,'sine',.022);tone(840,.055,'sine',.011,.025)}
    function showPetHearts(worker){if(motionReduced())return;const hearts=document.createElement('span');hearts.className='pet-hearts';hearts.setAttribute('aria-hidden','true');hearts.innerHTML='<i>♥</i><i>♥</i>';worker.appendChild(hearts);setTimeout(()=>hearts.remove(),780)}
    function showPetFeedback(worker,reward){const float=document.createElement('span');float.className='cat-income-float pet-coin-float';float.innerHTML=`<span class="coin-particle" aria-hidden="true"></span><span class="cat-income-text">+${reward}</span>`;worker.appendChild(float);setTimeout(()=>float.remove(),850);if(motionReduced())return;showPetHearts(worker);worker.classList.remove('petting');void worker.offsetWidth;worker.classList.add('petting');setTimeout(()=>worker.classList.remove('petting'),780)}
    function petCat(worker){const cat=catById[worker.dataset.catId],key=`${worker.dataset.catId}:${worker.dataset.workerIndex}`,now=Date.now();if(!cat)return;playPetSound();if(now<(petCooldowns.get(key)||0)){showPetHearts(worker);if(!motionReduced()){worker.classList.remove('pet-denied');void worker.offsetWidth;worker.classList.add('pet-denied');setTimeout(()=>worker.classList.remove('pet-denied'),320)}return}petCooldowns.set(key,now+PET_COOLDOWN_MS);const reward=petRewards[cat.rarity]||1;state.coins+=reward;save();updateUI();showPetFeedback(worker,reward)}
    function synthesizeHidden(){const cost=hiddenSynthesisCost();if(state.shards<cost){toast(`还差 ${fmt(cost-state.shards)} 碎片，继续开盲盒吧`);return}state.shards-=cost;state.hiddenSynthCount=(state.hiddenSynthCount||0)+1;addResult(resultForRarity('hidden'),{allowHiddenCopy:true});toast(`合成成功，隐藏彩虹猫降临！本次消耗 ${fmt(cost)} 碎片`);save();updateUI();openDrawer('collection')}
    function shareHidden(){const text='我在《猫咖盲盒》抽到了隐藏款彩虹猫！+200/s，猫咖已经起飞';if(navigator.share)navigator.share({title:'猫咖盲盒',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('分享文案已复制'));else toast(text)}
    function bind(){document.addEventListener('pointerdown',e=>{unlockAudio();if(!e.target.closest('#soundBtn'))startMusic()},{once:false});$('sceneWorkers').addEventListener('pointerdown',e=>{const worker=e.target.closest('.worker-cat');if(!worker)return;e.preventDefault();petCat(worker)});$('sceneWorkers').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const worker=e.target.closest('.worker-cat');if(!worker)return;e.preventDefault();petCat(worker)});$('boxRow').addEventListener('click',e=>{const btn=e.target.closest('[data-box]');if(!btn||btn.disabled||selectedBox===btn.dataset.box)return;selectedBox=btn.dataset.box;renderBoxes()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('catDetailBackdrop').classList.contains('open'))closeCatDetail();else if($('leaderboardBackdrop').classList.contains('open'))closeLeaderboard();else if($('probabilityBackdrop').classList.contains('open'))closeProbability();else if($('drawerBackdrop').classList.contains('open'))$('drawerBackdrop').classList.remove('open')}});$('singleBtn').addEventListener('click',()=>runDraw(1,state.firstFree));$('tenBtn').addEventListener('click',()=>runDraw(10,false));$('skipBtn').addEventListener('click',()=>{skipReveal=true});$('shareBtn').addEventListener('click',shareHidden);$('continueBtn').addEventListener('click',()=>{$('revealBackdrop').classList.remove('open');$('revealModal').className='reveal-modal'});$('openProbabilityBtn').addEventListener('click',openProbability);$('closeProbability').addEventListener('click',closeProbability);$('probabilityBackdrop').addEventListener('click',e=>{if(e.target===$('probabilityBackdrop'))closeProbability()});$('openCollectionBtn').addEventListener('click',()=>openDrawer('collection'));$('openUpgradeBtn').addEventListener('click',()=>openDrawer('upgrade'));$('openLeaderboardBtn').addEventListener('click',openLeaderboard);$('profileBtn').addEventListener('click',()=>ToyBridge.refreshProfile());$('closeDrawer').addEventListener('click',()=>$('drawerBackdrop').classList.remove('open'));$('drawerBackdrop').addEventListener('click',e=>{if(e.target===$('drawerBackdrop'))$('drawerBackdrop').classList.remove('open')});$('closeCatDetail').addEventListener('click',closeCatDetail);$('catDetailBackdrop').addEventListener('click',e=>{if(e.target===$('catDetailBackdrop'))closeCatDetail()});$('closeLeaderboard').addEventListener('click',closeLeaderboard);$('leaderboardBackdrop').addEventListener('click',e=>{if(e.target===$('leaderboardBackdrop'))closeLeaderboard()});$('refreshLeaderboardBtn').addEventListener('click',loadLeaderboard);$('soundBtn').addEventListener('click',()=>{unlockAudio();if(!musicTimer&&!state.muted){startMusic();toast('音效与音乐已开启')}else{state.muted=!state.muted;if(state.muted)stopMusic();else startMusic();toast(state.muted?'音效已静音':'音效与音乐已开启')}$('soundBtn').classList.toggle('muted',state.muted);$('soundBtn').setAttribute('aria-label',state.muted?'开启音效':'关闭音效');save()});$('resetBtn').addEventListener('click',()=>{if(confirm('确定要清空猫咖存档吗？')){state=freshState();selectedBox='basic';save();updateUI();toast('新猫咖已经开张')}});document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(btn.dataset.view==='collection')openDrawer('collection');if(btn.dataset.view==='upgrade')openDrawer('upgrade');if(btn.dataset.view==='home')window.scrollTo({top:0,behavior:'smooth'})}));$('drawerBody').addEventListener('click',e=>{const btn=e.target.closest('[data-upgrade]');if(btn){upgradeTo(Number(btn.dataset.upgrade));return}const feature=e.target.closest('[data-feature-cat]');if(feature){e.preventDefault();e.stopPropagation();toggleFeatured(feature.dataset.featureCat);return}const synth=e.target.closest('[data-synth]');if(synth){synthesizeHidden();return}const card=e.target.closest('[data-cat-detail]');if(card)openCatDetail(card.dataset.catDetail)});$('drawerBody').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const card=e.target.closest('[data-cat-detail]');if(card&&!e.target.closest('button')){e.preventDefault();openCatDetail(card.dataset.catDetail)}});$('exportSaveBtn')?.addEventListener('click',exportSave);$('importSaveBtn')?.addEventListener('click',()=>$('importSaveInput').click());$('importSaveInput')?.addEventListener('change',e=>importSave(e.target.files[0]))}
    const htmlEscape=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function hasToySdk(){return Boolean(window.toy&&typeof window.toy.getUserProfile==='function'&&(!window.location||window.location.protocol!=='file:'))}
    function updateProfileUI(name,connected=false,loading=false){const btn=$('profileBtn'),label=$('profileName');if(!btn||!label)return;label.textContent=name||'本地模式';btn.classList.toggle('connected',connected);btn.classList.toggle('loading',loading);btn.setAttribute('aria-label',connected?'刷新 B 站昵称':'获取 B 站昵称')}
    function clampScore(value){return Math.max(-16777216,Math.min(16777215,Math.floor(Number(value)||0)))}
    const withTimeout=(promise,ms=6000)=>Promise.race([Promise.resolve().then(()=>promise),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))]);
    async function refreshToyProfile(){if(profileBusy)return;profileBusy=true;updateProfileUI(hasToySdk()?'获取中…':'本地模式',false,true);if(!hasToySdk()){profileBusy=false;updateProfileUI('本地模式');return{localOnly:true}}try{const profile=await withTimeout(window.toy.getUserProfile());const nickname=profile&&profile.nickname?String(profile.nickname):'游客';if(nickname&&nickname!=='游客'){state.playerName=nickname;save();updateProfileUI(nickname,true);return{online:true,profile}}updateProfileUI('游客');return{online:true,guest:true}}catch(error){updateProfileUI('Toy 不可用');return{online:true,error}}finally{profileBusy=false}}
    async function submitCollectionScore(score){if(!hasToySdk())return{localOnly:true};try{return{online:true,result:await withTimeout(window.toy.submitScore({board:1,score:clampScore(score)}))}}catch(error){return{online:true,error}}}
    async function fetchLeaderboard(limit=50){if(!hasToySdk())return{online:false,list:[],mine:{ranked:false,rank:0,score:0}};try{const list=await withTimeout(window.toy.getRankList({board:1,period:'all',limit:Math.min(100,Math.max(1,limit))}));let mine={ranked:false,rank:0,score:0};try{mine=await withTimeout(window.toy.getMyRank({board:1,period:'all'}),4000)}catch{}return{online:true,list:Array.isArray(list)?list:[],mine}}catch(error){return{online:true,list:[],mine:{ranked:false,rank:0,score:0},error}}}
    function queueScoreSubmit(){if(scoreSubmitTimer)clearTimeout(scoreSubmitTimer);scoreSubmitTimer=setTimeout(()=>{scoreSubmitTimer=null;window.ToyBridge.submitCollection(state.cats.length)},900)}
    function leaderboardMarkup(data){if(!data.online)return `<div class="leaderboard-local">本地成绩 · 娱乐排行（数据保存在本机，可被修改，不代表官方榜单）</div><div class="leaderboard-data"><span>我的图鉴 ${state.cats.length}/27</span><span>金币 ${fmt(state.coins)}</span></div>`;if(data.error&&!data.list.length)return `<div class="leaderboard-empty">Toy 榜单暂时不可用，单机玩法不受影响。</div>`;const rows=data.list.map(item=>{const mine=data.mine.ranked&&item.rank===data.mine.rank;const avatar=item.avatar&&/^https?:|^\/\//.test(item.avatar)?`<img class="rank-avatar" src="${htmlEscape(item.avatar)}" alt="">`:`<span class="rank-avatar" aria-hidden="true">${htmlEscape(String(item.nickname||'?').slice(0,1))}</span>`;return `<div class="rank-row ${mine?'mine':''}"><span class="rank-number">${Number(item.rank)||'-'}</span><span class="rank-player">${avatar}<span class="rank-nickname">${htmlEscape(item.nickname||'B站玩家')}</span></span><strong class="rank-score">${fmt(item.score||0)} 只</strong></div>`}).join('');const mine=data.mine&&data.mine.ranked?`<div class="leaderboard-me"><span>我的排名</span><strong>第 ${data.mine.rank} 名 · ${fmt(data.mine.score)} 只</strong></div>`:'<div class="leaderboard-me"><span>我的排名</span><strong>暂未上榜</strong></div>';return `<div class="leaderboard-list">${rows||'<div class="leaderboard-empty">还没有榜单记录，成为第一个收集猫咪的人吧。</div>'}</div>${mine}<div class="leaderboard-data"><span>我的图鉴 ${state.cats.length}/27</span><span>金币 ${fmt(state.coins)}</span></div>`}
    async function loadLeaderboard(){if(leaderboardBusy)return;leaderboardBusy=true;$('leaderboardBody').innerHTML='<div class="leaderboard-local">正在读取排行榜…</div>';try{await window.ToyBridge.submitCollection(state.cats.length);const data=await window.ToyBridge.getLeaderboard(50);leaderboardCache=data;$('leaderboardStatus').textContent=data.online?'Toy 榜单':'本地模式';$('leaderboardStatus').classList.toggle('online',data.online);$('leaderboardBody').innerHTML=leaderboardMarkup(data);if(data.online&&data.mine?.ranked&&data.mine.rank<=10)toast(`你已进入图鉴榜前 ${data.mine.rank}！`)}catch{$('leaderboardStatus').textContent='本地模式';$('leaderboardStatus').classList.remove('online');$('leaderboardBody').innerHTML='<div class="leaderboard-empty">排行榜暂时不可用，单机玩法不受影响。</div>'}finally{leaderboardBusy=false}}
    function openLeaderboard(){if($('catDetailBackdrop').classList.contains('open'))closeCatDetail();$('leaderboardBackdrop').classList.add('open');$('leaderboardBackdrop').setAttribute('aria-hidden','false');loadLeaderboard();}

    window.ToyBridge={version:'toy-sdk-v1',isAvailable:hasToySdk,getDisplayName:()=>state.playerName,getLeaderboardSnapshot:()=>({name:state.playerName,collection:state.cats.length,income:incomePerSecond(),coins:Math.floor(state.coins)}),refreshProfile:refreshToyProfile,submitCollection:submitCollectionScore,getLeaderboard:fetchLeaderboard};
    
    load();initPowerMode();bind();updateUI();startCoinParticles();setTimeout(()=>window.ToyBridge.refreshProfile(),250);setInterval(tick,200);
  })();
